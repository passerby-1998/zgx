            /*  CUSTOM CHECKBOX */
            #pardot-form p.pd-checkbox input[type='checkbox'] + label {
                display: flex;
                cursor: pointer;
            }
            #pardot-form p.pd-checkbox input[type='checkbox'] + label::before {
                display: inline-flex;
                border: 2px solid black;
                content: '';
                min-width: 24px;
                width: 24px;
                height: 24px;
                margin-right: 8px;
                transition: background-color 350ms, opacity 250ms;
            }
            /* NOT CHECKED (DEFAULT) */
            #pardot-form p.pd-checkbox input[type='checkbox']:not(:checked) + label::before {
                background-image: url('../../../whiteTick.svg'); /* Preload image */
                background-size: 0;
            }
            /* CHECKED */
            #pardot-form p.pd-checkbox input[type='checkbox']:checked + label::before {
                background-color: black;
                background-image: url('../../../whiteTick.svg');
                background-size: contain;
                background-position: 50% 50%;
                background-repeat: no-repeat;
            }
            #pardot-form input[type='submit'] {
                transition: background-color 250ms,  color 250ms;
            }
            /* ERRORS */
